info:
  label: Radio Cult API
  description: Power your online radio station website with the Radio Cult API. Manage artists, schedules, media, playlists,
    recordings, and live streaming metadata.
  tags:
  - Radio
  - Cult
  - API
  created: '2026-05-06'
  modified: '2026-05-06'
capability:
