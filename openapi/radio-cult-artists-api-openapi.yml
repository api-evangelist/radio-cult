openapi: 3.2.0
info:
  title: Radio Cult Artists API
  description: Power your online radio station website with the Radio Cult API. Manage artists, schedules, media, playlists, recordings, and live streaming metadata.
  version: '1.0'
  contact:
    name: Radio Cult
    url: https://www.radiocult.fm/docs/api
servers:
- url: https://api.radiocult.fm
  description: Radio Cult production API
security:
- ApiKeyAuth: []
tags:
- name: Artists
paths:
  /api/station/{stationId}/artists:
    get:
      tags:
      - Artists
      summary: Retrieve all artists
      parameters:
      - name: stationId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: List of artists
      operationId: getApiStationByStationIdArtists
      x-operation-id-source: derived
    post:
      tags:
      - Artists
      summary: Create an artist
      parameters:
      - name: stationId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Created artist
      operationId: postApiStationByStationIdArtists
      x-operation-id-source: derived
  /api/station/{stationId}/artists/{artistId}:
    get:
      tags:
      - Artists
      summary: Fetch artist by ID or slug
      parameters:
      - name: stationId
        in: path
        required: true
        schema:
          type: string
      - name: artistId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Artist record
      operationId: getApiStationByStationIdArtistsByArtistId
      x-operation-id-source: derived
  /api/station/{stationId}/artists/{artistId}/schedule:
    get:
      tags:
      - Artists
      summary: Get an artist's scheduled events
      parameters:
      - name: stationId
        in: path
        required: true
        schema:
          type: string
      - name: artistId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Scheduled events
      operationId: getApiStationByStationIdArtistsByArtistIdSchedule
      x-operation-id-source: derived
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
