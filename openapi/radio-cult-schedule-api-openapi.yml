openapi: 3.2.0
info:
  title: Radio Cult Schedule API
  description: Power your online radio station website with the Radio Cult API. Manage artists, schedules, media, playlists, recordings, and live streaming metadata.
  version: '1.0'
  contact:
    name: Radio Cult
    url: https://www.radiocult.fm/docs/api
servers:
- url: https://api.radiocult.fm
  description: Radio Cult production API
security:
- ApiKeyAuth: []
tags:
- name: Schedule
paths:
  /api/station/{stationId}/schedule:
    get:
      tags:
      - Schedule
      summary: Get events in a date range
      parameters:
      - name: stationId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Scheduled events
      operationId: getApiStationByStationIdSchedule
      x-operation-id-source: derived
  /api/station/{stationId}/schedule/live:
    get:
      tags:
      - Schedule
      summary: Current live broadcast status and metadata
      parameters:
      - name: stationId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Live broadcast status
      operationId: getApiStationByStationIdScheduleLive
      x-operation-id-source: derived
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
